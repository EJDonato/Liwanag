services:
  db:
    image: postgres:16
    container_name: liwanag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liwanag
    ports:
      - "5432:5432"
    volumes:
      - liwanag-data:/var/lib/postgresql/data

volumes:
  liwanag-data:
